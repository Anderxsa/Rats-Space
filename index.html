<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rats Space</title>
    <link rel="shortcut icon" href="#" />
    <style>
      html {
        height: 100%;
        overflow: hidden;
      }
      canvas {
        box-shadow: black 20px 10px 50px;
        border: 3px solid #ffffff;
        border-radius: 16px;
      }
      h1 {
        margin: 0px;
        margin-bottom: 10px;
        font-size: 2.9em;
        font-family: "Helvetica";
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 0px;
        padding-left: 0px;
        margin: 0px;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        background-image: url("images/palacio%20de%20gobierno.webp");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        position: relative;
      }
      .logo-title {
        position: absolute;
        top: 20px;
        left: 20px;
        transform: none;
        width: 320px;
        height: auto;
        opacity: 0.9;
        pointer-events: none;
        user-select: none;
      }
      .rats-hud {
        position: absolute;
        left: 20px;
        top: 360px;
        color: #ffffff;
        font-family: "Arcade", Arial, sans-serif;
        font-size: 18px;
        text-shadow: 1px 1px 2px #000;
        pointer-events: none;
        user-select: none;
      }
      @media (max-width: 900px) {
        .logo-title {
          top: 10px;
          left: 10px;
          transform: none;
          width: 160px;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo-title" src="images/TITULO.png" alt="Titulo" />
    <div id="rats-hud" class="rats-hud">RATAS RESTANTES: 60</div>
    <canvas id="game"></canvas>
    <script type="module" src="index.js"></script>
  </body>
</html>
